services:
  mysql:
    image: mysql:8.0
    container_name: mysql-blog
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: blog
      TZ: Asia/Shanghai                    # 容器与 MySQL 默认时区东八区，与 JDBC serverTimezone=Asia/Shanghai 一致
    volumes:
      - mysql-data:/var/lib/mysql          # 数据持久化；要清空库可删此卷
      - ./mysql:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=+08:00
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio-blog
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Web 控制台
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  nacos:
    image: nacos/nacos-server:v2.3.0
    container_name: nacos-blog
    ports:
      - "8848:8848"   # HTTP
      - "9848:9848"   # gRPC
      - "9849:9849"   # gRPC
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      SPRING_DATASOURCE_PLATFORM: ""
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: SecretKey012345678901234567890123456789012345678901234567890123456789
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: security
      JVM_XMS: 256m
      JVM_XMX: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: es-blog
    ports:
      - "9200:9200"   # HTTP API
      - "9300:9300"   # 节点通信
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: pgvector/pgvector:pg16
    container_name: pgvector-blog
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
      POSTGRES_DB: blog_vector
      TZ: Asia/Shanghai
    volumes:
      - pgvector-data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d blog_vector"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------- 可观测性：指标 ----------
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus-blog
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.0
    container_name: grafana-blog
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # ---------- 可观测性：链路追踪 ----------
  jaeger:
    image: jaegertracing/all-in-one:1.52
    container_name: jaeger-blog
    ports:
      - "16686:16686"   # UI
      - "14268:14268"   # receive (HTTP)
      - "9411:9411"     # Zipkin 兼容（Brave 上报）
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      COLLECTOR_ZIPKIN_HOST_PORT: ":9411"
    restart: unless-stopped

  # ---------- 可观测性：日志 ----------
  loki:
    image: grafana/loki:3.0.0
    container_name: loki-blog
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail-blog
    command: -config.file=/etc/promtail/promtail-config.yaml -config.expand-env=true
    volumes:
      - ./observability/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - app-logs:/var/log/app:ro
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  mysql-data:   # MySQL 数据；删除此卷后 up 会重新执行 init 脚本，user 表变空
  minio-data:
  es-data:      # Elasticsearch 索引与数据持久化
  pgvector-data: # PostgreSQL + pgvector，用于 RAG 向量检索
  prometheus-data:
  grafana-data:
  loki-data:
  app-logs:     # 应用日志目录，各服务将日志写入此处后由 Promtail 采集
