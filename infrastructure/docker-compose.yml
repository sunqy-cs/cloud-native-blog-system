services:
  mysql:
    image: mysql:8.0
    container_name: mysql-blog
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: blog
      TZ: Asia/Shanghai                    # 容器与 MySQL 默认时区东八区，与 JDBC serverTimezone=Asia/Shanghai 一致
    volumes:
      - mysql-data:/var/lib/mysql          # 数据持久化；要清空库可删此卷
      - ./mysql:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=+08:00
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio-blog
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Web 控制台
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  nacos:
    image: nacos/nacos-server:v2.3.0
    container_name: nacos-blog
    ports:
      - "8848:8848"   # HTTP
      - "9848:9848"   # gRPC
      - "9849:9849"   # gRPC
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      SPRING_DATASOURCE_PLATFORM: ""
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: SecretKey012345678901234567890123456789012345678901234567890123456789
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: security
      JVM_XMS: 256m
      JVM_XMX: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: es-blog
    ports:
      - "9200:9200"   # HTTP API
      - "9300:9300"   # 节点通信
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql-data:   # MySQL 数据；删除此卷后 up 会重新执行 init 脚本，user 表变空
  minio-data:
  es-data:      # Elasticsearch 索引与数据持久化
