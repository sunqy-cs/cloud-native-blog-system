apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: blog-app
spec:
  ports:
    - port: 8086
      targetPort: 8086
      name: http
  selector:
    app: ai-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: blog-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node
                    operator: In
                    values: [node2, node3]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: ai-service
              topologyKey: kubernetes.io/hostname
      containers:
        - name: ai-service
          image: registry.cn-beijing.aliyuncs.com/your-namespace/ai-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8086
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          env:
            - name: NACOS_SERVER
              value: "nacos.blog-infra.svc.cluster.local:8848"
            - name: APP_CONTENT_SERVICE_URL
              value: "http://content-service:8084"
            - name: APP_FILE_SERVICE_BASE_URL
              value: "http://file-service:8083"
            # DeepSeek/DashScope API Key 请用 Secret 或另行配置，勿写死
            # - name: DEEPSEEK_API_KEY
            #   valueFrom: secretKeyRef: ...
