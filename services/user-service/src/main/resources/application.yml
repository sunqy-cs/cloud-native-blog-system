server:
  port: 8081

spring:
  application:
    name: user-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: nacos
        ip: 127.0.0.1
        port: ${server.port}
  datasource:
    url: jdbc:mysql://localhost:3306/blog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: your-256-bit-secret-key-change-in-production-please
  expiration-ms: 86400000

app:
  content-service-url: http://localhost:8084

# 阿里云号码认证：SendSmsVerifyCode / CheckSmsVerifyCode
# 切勿将 AccessKey 写入本文件并提交。请使用：
#   1) 环境变量 ALIYUN_DYPNS_ACCESS_KEY_ID / ALIYUN_DYPNS_ACCESS_KEY_SECRET / ALIYUN_DYPNS_ENABLED
#   2) 或复制 application-local.yml.example 为 application-local.yml 并 spring.profiles.active=local（该文件已被 .gitignore）
# 控制台模板变量为 ${code}、${min} 时，发送接口用 ##code## 由平台生成验证码
aliyun:
  dypns:
    enabled: ${ALIYUN_DYPNS_ENABLED:false}
    access-key-id: ${ALIYUN_DYPNS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_DYPNS_ACCESS_KEY_SECRET:}
    region-id: cn-hangzhou
    sign-name: 速通互联验证码
    template-code: "100001"
    template-param-json: '{"code":"##code##","min":"5"}'
    code-type: 1
    code-length: 6
    valid-time-seconds: 300
    send-interval-seconds: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
